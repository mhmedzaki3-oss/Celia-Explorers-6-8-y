<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f2027">
<title>عالم المستكشفين V3</title>
<style>
:root{--bg1:#0f2027;--bg2:#203a43;--bg3:#2c5364;--gold:#ffc93c;--mint:#4ecca3;--coral:#ff6b6b;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);--txt:#eaf6ff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));color:var(--txt);min-height:100vh;padding:14px;padding-bottom:90px;overscroll-behavior-y:contain;touch-action:manipulation;}
button,.card,.item,.sw,input[type=range]{touch-action:manipulation;-webkit-user-select:none;user-select:none;}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(15,32,39,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:14px;}
.topbar h1{font-size:16px}
.badge{background:linear-gradient(135deg,var(--gold),#ff9f1c);color:#3a2500;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;white-space:nowrap;}
.iconbtn{background:rgba(255,255,255,.12);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:8px 12px;font-size:16px;cursor:pointer;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:900px;margin:0 auto}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 10px;text-align:center;cursor:pointer;transition:transform .15s,background .15s;}
.card:active{transform:scale(.96)}
.card .ico{font-size:36px;display:block;margin-bottom:8px}
.card .nm{font-size:13.5px;font-weight:700;line-height:1.4}
.card .no{position:absolute;top:8px;left:8px;font-size:11px;font-weight:800;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:999px}
.card .star{position:absolute;top:8px;right:8px;font-size:12px;background:rgba(255,201,60,.2);padding:2px 6px;border-radius:999px}
.card .done-badge{position:absolute;bottom:6px;right:8px;font-size:14px}
.screen{display:none;max-width:720px;margin:0 auto}
.screen.on{display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.panel h2{font-size:19px;margin-bottom:6px}
.sub{font-size:13px;opacity:.8;margin-bottom:14px;line-height:1.7}
button{font-family:inherit;font-size:14.5px;font-weight:700;padding:12px 18px;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,var(--gold),#ff9f1c);color:#3a2500;margin:5px 3px;transition:transform .1s;}
button:active{transform:scale(.96)}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:rgba(255,255,255,.12);color:var(--txt);border:1px solid var(--line)}
button.mint{background:linear-gradient(135deg,var(--mint),#2a9d8f);color:#062b22}
button.coral{background:linear-gradient(135deg,var(--coral),#e63946);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>*{flex:1;min-width:110px}
.item{background:rgba(255,255,255,.09);border:1px solid var(--line);padding:12px 14px;border-radius:12px;margin:7px 0;cursor:pointer;font-size:14.5px;display:flex;align-items:center;gap:10px;}
.item.done{background:rgba(78,204,163,.25);border-color:var(--mint);text-decoration:line-through;opacity:.85}
.item .tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:0 0 auto}
.item.done .tick{background:var(--mint);border-color:var(--mint);color:#062b22}
.msg{text-align:center;font-weight:800;font-size:15px;min-height:24px;margin:12px 0;color:var(--gold)}
.prog{text-align:center;font-size:14px;font-weight:700;margin:8px 0}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:8px 0 12px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--gold));transition:width .3s}
.timer{height:10px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:10px 0}
.timer>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--coral),var(--gold));transition:width .1s linear}
.volcano{font-size:76px;text-align:center;margin:14px 0}
.volcano.shake{animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(0)}25%{transform:translate(-3px,2px) rotate(-4deg)}75%{transform:translate(3px,-2px) rotate(4deg)}100%{transform:translate(0)}}
.swatches{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.sw{width:52px;height:52px;border-radius:14px;cursor:pointer;border:3px solid rgba(255,255,255,.25);transition:.15s}
.sw.sel{border-color:#fff;transform:scale(1.12)}
.compass{text-align:center;font-size:15px;font-weight:800;margin:10px 0;min-height:30px}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:12px auto}
.dpad button{margin:0;padding:14px 0;font-size:16px}
.dpad .empty{visibility:hidden}
.bridge{font-size:72px;text-align:center;margin:14px 0;transition:.2s}
.bridge.broken{transform:rotate(8deg) scale(.9);opacity:.6}
.animal{font-size:80px;text-align:center;margin:14px 0}
.stage{height:180px;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,201,60,.15),transparent 70%);border-radius:16px;margin:10px 0}
.ball{background:radial-gradient(circle at 35% 30%,#ffe89a,var(--gold));border-radius:50%;transition:.15s;box-shadow:0 10px 30px rgba(255,201,60,.35)}
input[type=range]{width:100%;-webkit-appearance:none;height:8px;border-radius:99px;background:rgba(255,255,255,.15);outline:none;margin:10px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--gold);border:3px solid #fff;cursor:pointer}
input[type=password]{font-family:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--txt);width:100%;margin:6px 0;text-align:center;letter-spacing:4px;}
.rocket{font-size:70px;text-align:center;margin:14px 0;transition:.2s}
.rocket.fly{transform:translateY(-14px) scale(1.12)}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:60;background:rgba(15,32,39,.92);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:12px 26px;font-size:14.5px;font-weight:700;display:none;}
.fab.on{display:block}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:999}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;place-items:center;padding:20px}
.modal.on{display:grid}
.modal .box{background:#162a35;border:1px solid var(--line);border-radius:20px;padding:20px;max-width:400px;width:100%}
.modal h3{margin-bottom:14px;font-size:17px}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hint{font-size:12px;opacity:.7;text-align:center;margin:8px 0}
@media (max-width:420px){
  .topbar h1{font-size:14px}
  .badge{font-size:12px;padding:5px 10px}
  .card{padding:14px 8px}
  .card .ico{font-size:32px}
  .card .nm{font-size:12.5px}
  button{padding:13px 16px;font-size:15px}
  .dpad button{padding:16px 0;font-size:18px}
  .item{padding:13px 12px}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>🚀 عالم المستكشفين V3</h1>
  <div style="display:flex;gap:8px;align-items:center">
    <span class="badge" id="totalBadge">⭐ 0</span>
    <button class="iconbtn" onclick="openPin()">⚙️</button>
  </div>
</div>

<div id="home" class="screen on"><div class="grid" id="grid"></div></div>
<div id="gameHost"></div>
<button class="fab" id="fab" onclick="home()">⬅ رجوع للقائمة</button>
<canvas id="confetti"></canvas>

<div class="modal" id="pinModal">
  <div class="box">
    <h3>🔒 لوحة الوالدين</h3>
    <p class="hint">أدخل رقم PIN للمتابعة</p>
    <input type="password" id="pinInput" maxlength="6" inputmode="numeric" placeholder="••••">
    <div class="row">
      <button class="mint" onclick="checkPin()">دخول</button>
      <button class="ghost" onclick="closePin()">إلغاء</button>
    </div>
    <div class="msg" id="pinMsg"></div>
  </div>
</div>

<div class="modal" id="panel">
  <div class="box">
    <h3>⚙️ لوحة الوالدين</h3>
    <div id="stats"></div>
    <div class="row">
      <button class="coral" onclick="resetStars()">🔄 تصفير النجوم</button>
      <button class="ghost" onclick="changePin()">🔑 تغيير PIN</button>
    </div>
    <div class="row"><button class="ghost" onclick="closePanel()" style="flex:1">إغلاق</button></div>
  </div>
</div>

<script>
/* ==================== الأصوات ==================== */
const AudioFX = (()=>{
  let ctx=null;
  function getCtx(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; }
  function tone(freq,dur,type='sine',vol=0.15){
    const c=getCtx(); if(!c) return;
    if(c.state==='suspended') c.resume();
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  }
  return {
    click(){ tone(660,0.06,'square',0.08); },
    success(){ tone(660,0.1); setTimeout(()=>tone(880,0.15),90); },
    win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.2,'triangle',0.18),i*100)); },
    fail(){ tone(200,0.25,'sawtooth',0.12); },
    pop(){ tone(880,0.05,'sine',0.1); }
  };
})();

/* ==================== سجل المؤقتات ==================== */
const ACTIVE_TIMERS = new Set();
function setGameInterval(fn, ms){ const id=setInterval(fn,ms); ACTIVE_TIMERS.add(id); return id; }
function setGameTimeout(fn, ms){ const id=setTimeout(()=>{ ACTIVE_TIMERS.delete(id); fn(); },ms); ACTIVE_TIMERS.add(id); return id; }
function clearGameTimer(id){ if(!id) return; clearInterval(id); clearTimeout(id); ACTIVE_TIMERS.delete(id); }
function clearAllTimers(){ ACTIVE_TIMERS.forEach(id=>{ clearInterval(id); clearTimeout(id); }); ACTIVE_TIMERS.clear(); }

/* ==================== الحفظ ==================== */
const KEY='explorer_v3_save', PIN_KEY='explorer_v3_pin', DEFAULT_PIN='2468';
let SAVE={total:0,played:{},completed:{}};
try{ const raw=localStorage.getItem(KEY); if(raw) SAVE=Object.assign(SAVE,JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(SAVE)); }catch(e){} }
function getPin(){ try{ return localStorage.getItem(PIN_KEY)||DEFAULT_PIN; }catch(e){ return DEFAULT_PIN; } }
function setPin(p){ try{ localStorage.setItem(PIN_KEY,p); }catch(e){} }

function awardOnce(id,pts){
  if(SAVE.completed[id]) return false;
  SAVE.completed[id]=true; SAVE.total+=pts;
  SAVE.played[id]=(SAVE.played[id]||0)+pts;
  save(); renderBadge(); confettiBurst(); AudioFX.win(); return true;
}
function awardCapped(id,pts,cap){
  const cur=SAVE.played[id]||0; if(cur>=cap) return false;
  const add=Math.min(pts,cap-cur);
  SAVE.total+=add; SAVE.played[id]=cur+add;
  save(); renderBadge(); AudioFX.success(); return true;
}
function renderBadge(){
  document.getElementById('totalBadge').textContent='⭐ '+SAVE.total;
  renderGrid();
}

const GAMES=[
  {n:1,ico:'🗺️',nm:'البحث عن الكنز',max:10},
  {n:2,ico:'🔍',nm:'الاستكشاف الطبيعي',max:15},
  {n:3,ico:'🧪',nm:'مختبر المطبخ',max:15},
  {n:4,ico:'🧭',nm:'لعبة الاتجاهات',max:20},
  {n:5,ico:'🏗️',nm:'بناء الجسر',max:8},
  {n:6,ico:'🐾',nm:'آثار الحيوانات',max:12},
  {n:7,ico:'🌍',nm:'جواز السفر',max:15},
  {n:8,ico:'🔦',nm:'لعبة الظلال',max:5},
  {n:9,ico:'🧩',nm:'صندوق اللمس',max:12},
  {n:10,ico:'🚀',nm:'رواد الفضاء',max:20}
];

function renderGrid(){
  document.getElementById('grid').innerHTML=GAMES.map(g=>{
    const p=SAVE.played[g.n]||0, done=SAVE.completed[g.n];
    return `<div class="card" onclick="open(${g.n})">
      <span class="no">#${g.n}</span>
      ${p>0?`<span class="star">⭐${p}</span>`:''}
      ${done?`<span class="done-badge">✅</span>`:''}
      <span class="ico">${g.ico}</span>
      <span class="nm">${g.nm}</span>
    </div>`;
  }).join('');
}

/* ==================== PIN ==================== */
function openPin(){
  document.getElementById('pinInput').value='';
  document.getElementById('pinMsg').textContent='';
  document.getElementById('pinModal').classList.add('on');
  setTimeout(()=>document.getElementById('pinInput').focus(),100);
}
function closePin(){ document.getElementById('pinModal').classList.remove('on'); }
function checkPin(){
  const v=document.getElementById('pinInput').value.trim();
  if(v===getPin()){ closePin(); openPanel(); AudioFX.success(); }
  else { document.getElementById('pinMsg').textContent='❌ PIN غير صحيح'; AudioFX.fail(); }
}
function openPanel(){
  const stats=GAMES.map(g=>{
    const p=SAVE.played[g.n]||0;
    return `<div class="stat"><span>${g.ico} ${g.nm}</span><span>${p>0?'⭐'+p+'/'+g.max:'—'}</span></div>`;
  }).join('');
  document.getElementById('stats').innerHTML=
    `<div class="stat" style="font-weight:800"><span>الإجمالي</span><span>⭐ ${SAVE.total}</span></div>`+stats;
  document.getElementById('panel').classList.add('on');
}
function closePanel(){ document.getElementById('panel').classList.remove('on'); }
function resetStars(){
  if(confirm('هل تريد تصفير كل النجوم والتقدم؟ لا يمكن الرجوع.')){
    SAVE={total:0,played:{},completed:{}};
    save(); renderBadge(); closePanel(); AudioFX.pop();
  }
}
function changePin(){
  const np=prompt('أدخل PIN الجديد (4-6 أرقام):');
  if(!np) return;
  if(!/^\d{4,6}$/.test(np)){ alert('PIN يجب أن يكون 4-6 أرقام'); return; }
  setPin(np); alert('✅ تم تغيير PIN'); AudioFX.success();
}

/* ==================== التنقل ==================== */
let CURRENT=null;
function home(){
  clearAllTimers();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('home').classList.add('on');
  document.getElementById('fab').classList.remove('on');
  CURRENT=null; scrollTo(0,0); renderGrid();
}
function open(n){
  clearAllTimers();
  CURRENT=n;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('home').classList.remove('on');
  document.getElementById('fab').classList.add('on');
  const host=document.getElementById('gameHost');
  host.innerHTML='';
  const el=document.createElement('div');
  el.className='screen on';
  host.appendChild(el);
  ({1:g1,2:g2,3:g3,4:g4,5:g5,6:g6,7:g7,8:g8,9:g9,10:g10})[n](el);
  scrollTo(0,0);
}

const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.slice().sort(()=>Math.random()-.5);
function buzz(ms=30){ if(navigator.vibrate) navigator.vibrate(ms); }

/* ==================== كونفيتي ==================== */
const cvs=document.getElementById('confetti'), ctx=cvs.getContext('2d');
let parts=[], raf=null;
function sizeCanvas(){ cvs.width=innerWidth; cvs.height=innerHeight; }
addEventListener('resize',sizeCanvas); sizeCanvas();
function confettiBurst(){
  const colors=['#ffc93c','#4ecca3','#ff6b6b','#8ecae6','#fff'];
  for(let i=0;i<40;i++){
    parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.25,vx:(Math.random()-.5)*8,vy:Math.random()*-9-3,g:.35,life:70,c:rnd(colors),s:3+Math.random()*4});
  }
  if(!raf) loop();
}
function loop(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;
    ctx.globalAlpha=Math.max(0,p.life/70);
    ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,p.s,p.s);
  });
  ctx.globalAlpha=1;
  if(parts.length) raf=requestAnimationFrame(loop);
  else{ raf=null; ctx.clearRect(0,0,cvs.width,cvs.height); }
}

/* ==================== 1) الكنز ==================== */
function g1(el){
  const clues=['🔎 تحت الطاولة الكبيرة','🔎 خلف الباب','🔎 تحت الوسادة الزرقاء','🎁 مبروك! وجدت الكنز!'];
  let i=0;
  el.innerHTML=`<div class="panel">
    <h2>🗺️ البحث عن الكنز</h2>
    <p class="sub">اضغط "التالي" حتى تصل للكنز. المكافأة تُمنح مرة واحدة.</p>
    <div id="cList"></div>
    <div class="msg" id="cMsg"></div>
    <button class="mint" id="cNext">التالي ➡</button>
  </div>`;
  const render=()=>{
    document.getElementById('cList').innerHTML=clues.slice(0,i+1).map(c=>`<div class="item done"><span class="tick">✓</span>${c}</div>`).join('');
    document.getElementById('cMsg').textContent=i===clues.length-1?'🏆 أنت مستكشف حقيقي!':'';
  };
  document.getElementById('cNext').onclick=()=>{
    if(i<clues.length-1){
      i++; buzz(); AudioFX.click(); render();
      if(i===clues.length-1){ awardOnce(1,10); document.getElementById('cNext').disabled=true; }
    }
  };
  render();
}

/* ==================== 2) الطبيعة ==================== */
function g2(el){
  const items=['🍃 ورقة خضراء','🪨 حجر أملس','🌸 زهرة ملونة','🐜 حشرة صغيرة','🌰 بذرة','🪵 قطعة خشب'];
  el.innerHTML=`<div class="panel">
    <h2>🔍 الاستكشاف الطبيعي</h2>
    <p class="sub">اضغط على كل عنصر تجده. المكافأة مرة واحدة فقط.</p>
    <div class="bar"><i id="nBar"></i></div>
    <div class="prog" id="nProg">0 / ${items.length}</div>
    <div id="nList"></div>
    <div class="msg" id="nMsg"></div>
  </div>`;
  let found=0;
  document.getElementById('nList').innerHTML=items.map((t,k)=>`<div class="item" data-k="${k}"><span class="tick"></span>${t}</div>`).join('');
  document.getElementById('nList').onclick=e=>{
    const it=e.target.closest('.item');
    if(!it||it.classList.contains('done')) return;
    it.classList.add('done'); it.querySelector('.tick').textContent='✓';
    buzz(); AudioFX.pop(); found++;
    document.getElementById('nProg').textContent=found+' / '+items.length;
    document.getElementById('nBar').style.width=(found/items.length*100)+'%';
    if(found===items.length){
      document.getElementById('nMsg').textContent='🏆 وجدت كل العناصر!';
      awardOnce(2,15);
    }
  };
}

/* ==================== 3) المختبر ==================== */
function g3(el){
  const colors=['#e63946','#2a9d8f','#ffb703','#8338ec','#4cc9f0'];
  let sel=colors[0], fired=0;
  el.innerHTML=`<div class="panel">
    <h2>🧪 مختبر المطبخ</h2>
    <p class="sub">اختر لونًا ثم "فجّر". يمكنك التجربة 3 مرات فقط للمكافأة.</p>
    <div class="swatches" id="sw"></div>
    <div class="volcano" id="vol">🌋</div>
    <button class="coral" id="boom">💥 فجّر البركان!</button>
    <div class="msg" id="vMsg"></div>
  </div>`;
  document.getElementById('sw').innerHTML=colors.map((c,k)=>`<div class="sw ${k===0?'sel':''}" data-c="${c}" style="background:${c}"></div>`).join('');
  document.getElementById('sw').onclick=e=>{
    const s=e.target.closest('.sw'); if(!s) return;
    document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));
    s.classList.add('sel'); sel=s.dataset.c; AudioFX.click();
  };
  document.getElementById('boom').onclick=()=>{
    if(fired>=3){ document.getElementById('vMsg').textContent='✅ أكملت التجربة!'; return; }
    const v=document.getElementById('vol');
    v.style.color=sel; v.classList.add('shake'); buzz(60); AudioFX.pop();
    let n=0;
    const t=setGameInterval(()=>{
      v.textContent=n%2?'🌋':'💥';
      if(++n>7){
        clearGameTimer(t);
        v.textContent='🌋'; v.classList.remove('shake');
        fired++;
        const added=awardCapped(3,5,15);
        document.getElementById('vMsg').textContent=fired>=3?'✅ أكملت التجربة! ('+fired+'/3)':'🎉 فوران رائع!';
        if(added) AudioFX.success();
      }
    },130);
  };
}

/* ==================== 4) الاتجاهات ==================== */
function g4(el){
  const dirs=[{k:'شمال',a:'⬆'},{k:'جنوب',a:'⬇'},{k:'شرق',a:'➡'},{k:'غرب',a:'⬅'}];
  let score=0, target=null, timer=null, timeLeft=0, playing=false;
  el.innerHTML=`<div class="panel">
    <h2>🧭 لعبة الاتجاهات</h2>
    <p class="sub">اضغط الاتجاه الصحيح قبل انتهاء الوقت. كل 5 إجابات = 5 نجوم (حد أقصى 20).</p>
    <div class="compass" id="prompt">اضغط "ابدأ"</div>
    <div class="timer"><i id="tBar"></i></div>
    <div class="dpad">
      <div class="empty"></div><button class="ghost" data-d="شمال">⬆</button><div class="empty"></div>
      <button class="ghost" data-d="غرب">⬅</button>
      <button class="ghost" data-d="شرق">➡</button>
      <button class="ghost" data-d="جنوب">⬇</button>
    </div>
    <div class="prog" id="score">النقاط: 0</div>
    <div class="msg" id="dMsg"></div>
    <button class="mint" id="start">▶ ابدأ</button>
  </div>`;
  function round(){
    target=rnd(dirs);
    document.getElementById('prompt').textContent='اذهب '+target.k+' '+target.a;
    timeLeft=3.0; clearGameTimer(timer);
    document.getElementById('tBar').style.width='100%';
    timer=setGameInterval(()=>{
      timeLeft-=0.1;
      document.getElementById('tBar').style.width=Math.max(0,timeLeft/3*100)+'%';
      if(timeLeft<=0){
        clearGameTimer(timer);
        document.getElementById('dMsg').textContent='⏰ انتهى الوقت!';
        AudioFX.fail(); target=null;
        setGameTimeout(round,600);
      }
    },100);
  }
  document.getElementById('start').onclick=()=>{
    score=0; playing=true;
    document.getElementById('score').textContent='النقاط: 0';
    document.getElementById('dMsg').textContent=''; AudioFX.click(); round();
  };
  el.querySelectorAll('[data-d]').forEach(b=>{
    b.onclick=()=>{
      if(!playing||!target) return;
      if(b.dataset.d===target.k){
        score++; buzz(); AudioFX.success();
        document.getElementById('score').textContent='النقاط: '+score;
        document.getElementById('dMsg').textContent='✅ صحيح!';
        clearGameTimer(timer);
        if(score%5===0) awardCapped(4,5,20);
        setGameTimeout(round,300);
      } else {
        document.getElementById('dMsg').textContent='❌ حاول مرة أخرى';
        AudioFX.fail();
      }
    };
  });
}

/* ==================== 5) الجسر ==================== */
function g5(el){
  let coins=0, max=0;
  el.innerHTML=`<div class="panel">
    <h2>🏗️ بناء الجسر</h2>
    <p class="sub">أضف عملات حتى ينهار. مكافأة إذا تحمل 8+ عملات (مرة واحدة).</p>
    <div class="bridge" id="br">🌉</div>
    <div class="prog" id="coins">العملات: 0</div>
    <button class="mint" id="add">🪙 أضف عملة</button>
    <button class="ghost" id="reset">🔄 جسر جديد</button>
    <div class="msg" id="bMsg"></div>
  </div>`;
  function reset(){
    coins=0; max=0;
    document.getElementById('coins').textContent='العملات: 0';
    document.getElementById('bMsg').textContent='';
    const b=document.getElementById('br');
    b.textContent='🌉'; b.classList.remove('broken');
    document.getElementById('add').disabled=false;
  }
  document.getElementById('reset').onclick=()=>{ reset(); AudioFX.click(); };
  document.getElementById('add').onclick=()=>{
    if(max===-1) return;
    if(max===0) max=Math.floor(Math.random()*8)+3;
    coins++; buzz(); AudioFX.pop();
    document.getElementById('coins').textContent='العملات: '+coins;
    if(coins>=max){
      const b=document.getElementById('br');
      b.textContent='🧱'; b.classList.add('broken');
      document.getElementById('bMsg').textContent='💥 انهار الجسر! تحمل '+max+' عملات';
      document.getElementById('add').disabled=true; AudioFX.fail();
      if(max>=8) awardOnce(5,8);
      max=-1;
    } else {
      document.getElementById('bMsg').textContent='✅ الجسر صامد!';
    }
  };
  reset();
}

/* ==================== 6) الحيوانات ==================== */
function g6(el){
  const animals=[
    {name:'أسد',ico:'🦁',hint:'صوته زئير، آثاره كبيرة'},
    {name:'فيل',ico:'🐘',hint:'آثاره دائرية ضخمة، له خرطوم'},
    {name:'طائر',ico:'🐦',hint:'يطير ويغني، آثاره صغيرة'},
    {name:'أرنب',ico:'🐰',hint:'يقفز، آثاره صغيرة جدًا'}
  ];
  let target=null, solved=0;
  el.innerHTML=`<div class="panel">
    <h2>🐾 آثار الحيوانات</h2>
    <p class="sub">خمّن الحيوان من الوصف. كل 4 إجابات صحيحة = 6 نجوم (حد أقصى 12).</p>
    <div class="animal" id="ico">❓</div>
    <div class="msg" id="hint"></div>
    <div class="row" id="btns"></div>
  </div>`;
  function next(){
    target=rnd(animals);
    document.getElementById('ico').textContent='❓';
    document.getElementById('hint').textContent='💡 '+target.hint;
    document.getElementById('btns').innerHTML=shuffle(animals).map(a=>`<button class="ghost" data-n="${a.name}">${a.name}</button>`).join('');
    document.getElementById('btns').onclick=e=>{
      const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.n===target.name){
        document.getElementById('ico').textContent=target.ico;
        document.getElementById('hint').textContent='✅ صحيح! هو '+target.name;
        buzz(); AudioFX.success(); solved++;
        if(solved%4===0) awardCapped(6,6,12);
        setGameTimeout(next,1200);
      } else {
        document.getElementById('hint').textContent='❌ ليس '+b.dataset.n+'، حاول مجددًا';
        AudioFX.fail();
      }
    };
  }
  next();
}

/* ==================== 7) جواز السفر ==================== */
function g7(el){
  const countries=[
    {n:'مصر',f:'🇪🇬',fact:'الأهرامات'},
    {n:'اليابان',f:'🇯🇵',fact:'جبل فوجي'},
    {n:'البرازيل',f:'🇧🇷',fact:'الأمازون'},
    {n:'فرنسا',f:'🇫🇷',fact:'برج إيفل'},
    {n:'أستراليا',f:'🇦🇺',fact:'الكنغر'}
  ];
  let stamps=0;
  el.innerHTML=`<div class="panel">
    <h2>🌍 جواز السفر</h2>
    <p class="sub">اضغط على كل دولة لجمع ختمها. المكافأة عند إكمال الكل.</p>
    <div class="bar"><i id="pBar"></i></div>
    <div class="prog" id="pProg">الأختام: 0 / 5</div>
    <div id="list"></div>
    <div class="msg" id="pMsg"></div>
  </div>`;
  document.getElementById('list').innerHTML=countries.map((c,k)=>`<div class="item" data-k="${k}"><span class="tick"></span>${c.f} ${c.n} — ${c.fact}</div>`).join('');
  document.getElementById('list').onclick=e=>{
    const it=e.target.closest('.item');
    if(!it||it.classList.contains('done')) return;
    it.classList.add('done'); it.querySelector('.tick').textContent='✓';
    buzz(); AudioFX.pop(); stamps++;
    document.getElementById('pProg').textContent='الأختام: '+stamps+' / 5';
    document.getElementById('pBar').style.width=(stamps/5*100)+'%';
    if(stamps===5){
      document.getElementById('pMsg').textContent='🏆 أكملت الرحلة حول العالم!';
      awardOnce(7,15);
    }
  };
}

/* ==================== 8) الظلال ==================== */
function g8(el){
  let minReached=200, maxReached=0;
  el.innerHTML=`<div class="panel">
    <h2>🔦 لعبة الظلال</h2>
    <p class="sub">حرّك الشريط لتجربة الحجمين: أقل من 60 وأكبر من 170 لتحصل على النجمة.</p>
    <div class="stage"><div class="ball" id="ball"></div></div>
    <input type="range" id="rng" min="40" max="180" value="100">
    <div class="prog" id="sz">الحجم: 100</div>
    <div class="msg" id="sMsg"></div>
  </div>`;
  const ball=document.getElementById('ball');
  function set(v){
    ball.style.width=v+'px'; ball.style.height=v+'px';
    ball.style.opacity=(0.4+v/200).toFixed(2);
    document.getElementById('sz').textContent='الحجم: '+v;
    if(v<minReached) minReached=v;
    if(v>maxReached) maxReached=v;
    document.getElementById('sMsg').textContent=
      (minReached<=60 && maxReached>=170) ? '🏆 جربت الحجمين! (+5 نجوم)' :
      (v>=170?'🌟 أكبر حجم! حرّك للأسفل قليلًا':v<=50?'🔍 أصغر حجم! حرّك للأعلى':'');
    if(minReached<=60 && maxReached>=170) awardCapped(8,5,5);
  }
  document.getElementById('rng').oninput=e=>set(+e.target.value);
  set(100);
}

/* ==================== 9) صندوق اللمس ==================== */
function g9(el){
  const items=[
    {n:'إسفنجة',d:'ناعمة وخفيفة'},
    {n:'حجر',d:'صلب وثقيل'},
    {n:'ريشة',d:'خفيفة جدًا وناعمة'},
    {n:'صنوبرة',d:'خشنة ومخروطية'},
    {n:'كرة قطن',d:'طرية وناعمة'}
  ];
  let target=null, solved=0;
  el.innerHTML=`<div class="panel">
    <h2>🧩 صندوق اللمس</h2>
    <p class="sub">اقرأ الوصف ثم خمّن الشيء. كل 4 إجابات = 6 نجوم (حد أقصى 12).</p>
    <div class="msg" id="tHint" style="font-size:17px">🎁 اضغط "اسحب شيئًا"</div>
    <button class="mint" id="draw">🎲 اسحب شيئًا</button>
    <div class="row" id="opts"></div>
    <div class="msg" id="tMsg"></div>
  </div>`;
  function next(){
    target=rnd(items);
    document.getElementById('tHint').textContent='🤔 '+target.d;
    document.getElementById('tMsg').textContent='';
    document.getElementById('opts').innerHTML=shuffle(items).map(t=>`<button class="ghost" data-n="${t.n}">${t.n}</button>`).join('');
  }
  document.getElementById('draw').onclick=()=>{ next(); AudioFX.click(); };
  document.getElementById('opts').onclick=e=>{
    const b=e.target.closest('button'); if(!b||!target) return;
    if(b.dataset.n===target.n){
      document.getElementById('tMsg').textContent='✅ صحيح! هو '+target.n;
      buzz(); AudioFX.success(); solved++;
      if(solved%4===0) awardCapped(9,6,12);
      target=null;
    } else {
      document.getElementById('tMsg').textContent='❌ حاول مرة أخرى';
      AudioFX.fail();
    }
  };
}

/* ==================== 10) رواد الفضاء ==================== */
function g10(el){
  const tasks=[
    '🏃 اقفز 10 قفزات',
    '🔄 دُر حول نفسك 3 مرات',
    '🧘 توازن على قدم واحدة 10 ثوان',
    '💪 اعمل 5 تمرينات ضغط',
    '🚀 قف كالصاروخ 5 ثوان'
  ];
  let done=0;
  el.innerHTML=`<div class="panel">
    <h2>🚀 دورة تدريب رواد الفضاء</h2>
    <p class="sub">أكمل كل مهمة لتتأهل للانطلاق!</p>
    <div class="rocket" id="rk">🚀</div>
    <div class="bar"><i id="rBar"></i></div>
    <div class="prog" id="rProg">0 / ${tasks.length}</div>
    <div id="tk"></div>
    <div class="msg" id="rMsg"></div>
  </div>`;
  document.getElementById('tk').innerHTML=tasks.map(t=>`<div class="item"><span class="tick"></span>${t}</div>`).join('');
  document.getElementById('tk').onclick=e=>{
    const it=e.target.closest('.item');
    if(!it||it.classList.contains('done')) return;
    it.classList.add('done'); it.querySelector('.tick').textContent='✓';
    buzz(); AudioFX.pop(); done++;
    document.getElementById('rProg').textContent=done+' / '+tasks.length;
    document.getElementById('rBar').style.width=(done/tasks.length*100)+'%';
    if(done===tasks.length){
      document.getElementById('rk').classList.add('fly');
      document.getElementById('rMsg').textContent='🏆 أصبحت رائد فضاء! انطلق!';
      setGameTimeout(()=>document.getElementById('rk').classList.remove('fly'),800);
      awardOnce(10,20);
    }
  };
}
